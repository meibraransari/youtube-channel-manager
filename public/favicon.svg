<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient: Obsidian Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="40%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <!-- Metallic Bezel Rim Gradient -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="80%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Glowing Cyan/Teal Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- YouTube Screen Pill Dual Gradient (Ruby to Cyan) -->
    <linearGradient id="ytDualGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0044"/>
      <stop offset="25%" stop-color="#e11d48"/>
      <stop offset="55%" stop-color="#9333ea"/>
      <stop offset="80%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>

    <!-- Metallic Specular Highlight -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Neon Cyan Outer Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur1"/>
      <feGaussianBlur stdDeviation="4" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Badge Drop Shadow -->
    <filter id="badgeShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00f5ff" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="118" fill="none" stroke="url(#bezelGrad)" stroke-width="12"/>

  <!-- Inner Ambient Gradient Orbs -->
  <circle cx="160" cy="180" r="130" fill="#ff0055" opacity="0.12"/>
  <circle cx="340" cy="330" r="130" fill="#00f5ff" opacity="0.15"/>

  <!-- Glowing Telemetry Neon Ring with Audio/Velocity Wave -->
  <g filter="url(#neonGlow)">
    <!-- Upper Circular Arc (from ~138,340 around clockwise to ~374,340) -->
    <path d="M 136 335 A 150 150 0 1 1 376 335" fill="none" stroke="url(#ringGrad)" stroke-width="8.5" stroke-linecap="round"/>
    
    <!-- Pulse Waveform connecting the bottom -->
    <path d="M 136 335 
             L 185 335 
             L 200 355 
             L 214 305 
             L 228 365 
             L 242 295 
             L 256 385 
             L 270 280 
             L 282 360 
             L 296 315 
             L 310 348 
             L 326 335 
             L 376 335" 
          fill="none" stroke="url(#ringGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Central YouTube Screen Pill -->
  <g filter="url(#badgeShadow)">
    <rect x="132" y="170" width="248" height="156" rx="48" fill="url(#ytDualGrad)"/>
    <!-- Top-Half Specular Highlight -->
    <path d="M 180 170 L 332 170 C 364 170 380 186 380 218 L 380 232 C 320 216 200 216 132 242 L 132 218 C 132 186 148 170 180 170 Z" fill="url(#sheenGrad)"/>
    <!-- Crisp Inner Inset Border -->
    <rect x="132" y="170" width="248" height="156" rx="48" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.35"/>
  </g>

  <!-- Center Play Button Triangle (Crisp, High Contrast, Perfectly Proportioned) -->
  <polygon points="232,208 304,248 232,288" fill="#ffffff" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
</svg>
